name: Helix CI
on: [push, pull_request, workflow_dispatch]
permissions: {}
jobs:
  tests:
    name: Tests and local audits
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Only platforms with approved wheel locks in data/tool-pins run here.
        # Add ubuntu-latest after collecting and reviewing linux-x86_64 cp312 pins
        # (scripts/collect_tool_pins.py on Linux), otherwise the job is always red.
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Full history: the release check reads origin/master, which a
          # pull_request checkout of depth 1 does not create.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Dependencies
        # Fails before pip when this runner has no approved wheel lock.
        # Uses --require-hashes --only-binary=:all: for the entire graph.
        run: python3 scripts/install_ci_dependencies.py
      - name: Workflow security
        run: zizmor --offline --pedantic .github/workflows
      - name: Local taint rule regressions
        run: semgrep --test --config config/tools tests/fixtures/semgrep
      - name: Unit and integration contracts
        run: python3 scripts/run_tests_parallel.py -j 2
      - name: Requirements and version
        run: |
          bin/helix --offline requirements check
          python3 scripts/check_release_version.py
          git diff --check
      - name: Read-only self audit
        run: bin/helix --offline new audit --no-probe --out "$RUNNER_TEMP/helix-self-audit"
