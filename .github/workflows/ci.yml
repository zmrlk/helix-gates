name: Chrome diagnostics
on: [push]
permissions: {}
jobs:
  chrome:
    name: Chrome in the measurement scope
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Diagnose
        run: python3 diag_chrome.py
